name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build with strict warnings
        run: make CC="${{ matrix.compiler }}" CFLAGS="-O2 -g -Werror"

      - name: Run regression and JSON smoke tests
        run: make check
